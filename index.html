<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm ngược hỗ trợ</title>
    <style>
        body {
            background-color: #0b1d3a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Khung đếm ngược chính - Nền xanh nước biển, viền trắng nổi 3D */
        .countdown-container {
            background: linear-gradient(145deg, #0f3854, #0a2239);
            border: 3px solid #ffffff;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            color: #ffffff;
            max-width: 450px;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.5),
                0 0 15px rgba(255, 255, 255, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .countdown-container h3 {
            margin-top: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        /* Khung chứa từng con số - Nền xanh bầu trời (Sky Blue), hiệu ứng 3D dập nổi */
        .time-box {
            background: linear-gradient(180deg, #38b6ff, #0077b6);
            border: 2px solid #ffffff;
            border-radius: 10px;
            padding: 12px 10px;
            min-width: 65px;
            box-shadow: 
                0 6px 0px #00407a, 
                0 8px 10px rgba(0, 0, 0, 0.4),
                inset 0 2px 2px rgba(255, 255, 255, 0.5);
        }

        .time-box span {
            display: block;
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .time-box label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #e0f2fe;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

<div class="countdown-container">
    <h3 id="status-title">Thời gian hỗ trợ còn lại</h3>
    <div class="timer">
        <div class="time-box"><span id="days">00</span><label>Ngày</label></div>
        <div class="time-box"><span id="hours">00</span><label>Giờ</label></div>
        <div class="time-box"><span id="minutes">00</span><label>Phút</label></div>
        <div class="time-box"><span id="seconds">00</span><label>Giây</label></div>
    </div>
</div>

<script>
    // Thiết lập mốc thời gian đích (Năm-Tháng-NgàyTHiờ:Phút:Giây)
    const targetDate = new Date("2026-8-21T00:00:00").getTime();

    function updateCountdown() {
        // Lấy thời gian hiện tại trực tiếp từ thiết bị/trình duyệt Client
        const clientNow = new Date().getTime();
        const difference = targetDate - clientNow;

        if (difference <= 0) {
            document.getElementById("status-title").innerText = "Hết thời hạn hỗ trợ!";
            document.querySelector(".timer").style.display = "none";
            clearInterval(timerInterval);
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = String(days).padStart(2, '0');
        document.getElementById("hours").innerText = String(hours).padStart(2, '0');
        document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
        document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    // Chạy đếm ngược mỗi 1 giây
    const timerInterval = setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

</body>
</html>
